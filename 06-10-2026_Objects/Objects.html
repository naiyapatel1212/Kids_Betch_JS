<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECT</title>
</head>
<body>
   <script>
        // NON-PRIMITIVE DATA TYPES 

        // OBJECT 

        // let name = "naiya" , "shaurya";   // Variable declaration expected.

    //    object : maltiple data type amd multiple value store

    //    name : "naiya"
    //    key : value 

    // let student_name = "shaurya";
    // let student_Age = 13; ..... 5 variable 

    let student1 = {

        name : "Naiya",
        age:20,
        std :12,
        mo : "9313811512",
        birth_Date : "01-09-2006",
        marks : [99,98,97,96,95], // array 
        percentage : "99%",
        isPass : true
    }

    console.log(typeof(student1)) // DATA TYPE FIND - TYPEOF 
    console.log(student1); // fully object print 

// [. operator]

    console.log(student1.name);
    console.log(student1.age);
    console.log(student1.marks); // fully array print

    console.log(student1.marks[0]); // 1st index marks print 
    console.log(student1.marks[3]);
    console.log(student1.marks[2]);

    // array - index - 0 1 2 3 4 5 
    
    [99,98,97,96,95]


   </script>
</body>
</html>
