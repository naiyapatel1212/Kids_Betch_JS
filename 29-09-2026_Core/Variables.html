<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
  
/*
        var : re-declre , re-update
        let : not redeclre but re-update
        const : fix ...  pi = 3.14 , not redeclre not re-update
*/


        // VAR DECLARATION : re-declre , re-update

        var number = 100; // FIRST TIME DECLARATION 

        console.log("Number Value 1 : " , number); // 100

        number = 200; // NOT DECLARE ---- BUT RE UPDATE 

        console.log("Number Value 2 : " , number); // 200

        var number = 300; // SECOND TIME SAME VARIABLE NAME --- RE DECLARE 

        console.log("Number Value 3 : " , number); // 300


        // LET DECLARATION : not redeclre but re-update

        let age = 20; // FIRST TIME DECLARATION 

        console.log("Age Value 1 : " , age); // 20


        age = 21; // NOT DECLARE ---- BUT RE UPDATE 

        console.log("Age Value 2 : " , age); // 21

        // let age = 22; // SECOND TIME SAME VARIABLE NAME --- RE DECLARE 
                      // ERROR SHOW --- BEACAUSE NO RE-DECLARE [LET]

// ERROR : Uncaught SyntaxError: Identifier 'age' has already been declared

        // console.log("Age Value 3 : " , age); // ERROR




        // CONST DECLARATION : not redeclre AND no-update

        const pi = 3.14;// FIRST TIME DECLARATION 

        console.log("pi Value 1: " , pi);

        pi = 4.16; // NOT RE-UPDATE 

        console.log("pi Value 2: " , pi);  // ERROR
    
// EROOR : Uncaught TypeError: Assignment to constant variablXe.

        pi = 5.14; // NOT DECLARE ---- NOT RE-UPDATE 

        console.log("pi Value 3: " , pi); // ERROR

// EROOR : Uncaught TypeError: Assignment to constant variable.

        

    </script>
</body>
</html>
